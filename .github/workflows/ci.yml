name: aegis-ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: ./scripts/cloud-agent-install.sh
      - name: Pytest
        run: PYTHONPATH=packages:apps/api pytest -q
      - name: Demo scan (in-process)
        run: ./scripts/demo-scan.sh
      - name: Self-audit (in-process)
        run: ./scripts/demo-scan.sh --self
